<!-- Contact Section -->
<section class="contact">
    <div class="contact-text">
        <span class="eyebrow">LET’S CONNECT</span>
        <h1>Get in touch</h1>
        <p>
            Got a question, a project in mind, or just want to say hi? Drop me a message and I’ll get back to you as soon as I can. 
        </p>

        <div class="contact-details">
            <p><strong>Email</strong><br>cupidofredrian@gmail.com</p>
            <p><strong>Phone</strong><br>0968 758 3902</p>
            <p><strong>Location</strong><br>La Trinidad, Benguet</p>
        </div>
    </div>

    <form class="contact-form">
        <label>
            Name
            <input type="text" required>
        </label>

        <label>
            Email
            <input type="email" required>
        </label>

        <label>
            Message
            <textarea rows="5" required></textarea>
        </label>

        <button type="submit">Send message</button>
    </form>
</section>
